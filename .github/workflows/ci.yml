name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  unit:
    name: Unit and verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          # Skip native rebuilds (node-window-manager) — unit tests do not need them,
          # and windows-latest currently exposes a VS version node-gyp cannot resolve.
          npm ci --ignore-scripts
          node node_modules/esbuild/install.js

      - name: Verify lockfile and index.html
        run: npm run verify

      - name: Unit tests
        run: npm test

      - name: Syntax-check first-party JS
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -File -Include *.js |
            Where-Object {
              $_.FullName -notmatch '\\node_modules\\|\\assets\\|\\dist\\' -and
              $_.Name -ne 'jscolor.js' -and
              $_.Name -notmatch '\.min\.js$'
            }
          foreach ($f in $files) {
            node --check $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $($f.FullName)" }
          }

  ahk:
    name: AHK compile
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          node node_modules/esbuild/install.js

      - name: Setup portable AutoHotkey v1
        shell: pwsh
        run: ./scripts/setup-ahk-v1.ps1

      - name: Smoke-compile fixture
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "compile-smoke.exe"
          $logDir = Join-Path $env:RUNNER_TEMP "ahk2exe-logs"
          ./scripts/build-ahk.ps1 `
            -InputPath "tests/fixtures/ahk/compile-smoke.ahk" `
            -OutputPath $out `
            -IconPath "" `
            -LogDir $logDir
        env:
          AHK2EXE_PATH: ${{ env.AHK2EXE_PATH }}
          AHK_BIN_PATH: ${{ env.AHK_BIN_PATH }}

      - name: Run AHK v1 fixture tests
        shell: pwsh
        run: npm run test:ahk
        env:
          AHK_V1_PATH: ${{ env.AHK_V1_PATH }}

      - name: Compile PieMenu.exe
        shell: pwsh
        run: |
          $logDir = Join-Path $env:RUNNER_TEMP "ahk2exe-logs"
          ./scripts/build-ahk.ps1 -LogDir $logDir
        env:
          AHK2EXE_PATH: ${{ env.AHK2EXE_PATH }}
          AHK_BIN_PATH: ${{ env.AHK_BIN_PATH }}

      - name: Upload PieMenu.exe and checksum
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PieMenu-exe
          path: |
            src/PieMenu.exe
            src/PieMenu.exe.sha256

      - name: Upload Ahk2Exe logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ahk2exe-logs
          path: ${{ runner.temp }}/ahk2exe-logs/**
          if-no-files-found: ignore

  electron-smoke:
    name: Electron smoke
    runs-on: windows-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          node node_modules/esbuild/install.js
          node node_modules/electron/install.js

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Electron smoke tests
        run: npm run test:e2e
        env:
          AHP_USER_DATA: ${{ runner.temp }}\ahp-userdata

  package:
    name: Package unpacked
    runs-on: windows-latest
    needs: [unit]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          node node_modules/esbuild/install.js
          node node_modules/electron/install.js

      - name: Build index scripts
        run: npm run build

      - name: Electron builder (dir)
        run: npx electron-builder --dir --win

      - name: Verify unpacked layout
        shell: pwsh
        run: ./scripts/verify-artifacts.ps1

      - name: Upload unpacked app
        uses: actions/upload-artifact@v4
        with:
          name: win-unpacked
          path: dist/win-unpacked/**
